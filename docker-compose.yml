# İsteğe bağlı: yerelde PostgreSQL yoksa `docker compose up -d` ile başlatın.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gorev
      POSTGRES_PASSWORD: gorev_dev
      POSTGRES_DB: gorev_takip
    ports:
      - "5434:5432"
    volumes:
      - gorev_db:/var/lib/postgresql/data
volumes:
  gorev_db:
